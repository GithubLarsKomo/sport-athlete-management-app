name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: sport_athlete
          POSTGRES_USER: sport_athlete
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sport_athlete -d sport_athlete"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      NODE_ENV: development
      AUTH_MODE: dev
      DATABASE_URL: postgresql://sport_athlete:test-password@127.0.0.1:5432/sport_athlete
      DB_POOL_MAX: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run check
      - run: npm run migrate
      - run: npm run ready
      - run: npm run test:integration
      - run: npm run reconcile
      - run: docker build -t sport-athlete-management-app:ci .

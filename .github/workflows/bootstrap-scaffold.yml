name: Bootstrap scaffold

on:
  push:
    branches: [feat/initial-vertical-slice]
    paths:
      - '.bootstrap/scaffold.tar.gz'
      - '.github/workflows/bootstrap-scaffold.yml'

permissions:
  contents: write

concurrency:
  group: bootstrap-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand tested scaffold
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .bootstrap/extract
          tar -xzf .bootstrap/scaffold.tar.gz -C .bootstrap/extract
          cp -a .bootstrap/extract/. .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-scaffold.yml
      - name: Commit expanded repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: bootstrap athlete management app'
          git push origin HEAD:${GITHUB_REF_NAME}

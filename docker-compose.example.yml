services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: sport_athlete
      POSTGRES_USER: sport_athlete
      POSTGRES_PASSWORD: change-me
    volumes:
      - sport-athlete-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sport_athlete -d sport_athlete"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sport_athlete:change-me@db:5432/sport_athlete
      DB_POOL_MAX: 5
      AUTH_MODE: dev
      DEV_USER_ID: demo-athlete
      DEV_USER_NAME: Demo Athlete
    ports:
      - "3000:3000"

volumes:
  sport-athlete-db:
